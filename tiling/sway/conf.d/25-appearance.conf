# waybar already shows the focused title, so drop sway's titlebars
default_border pixel 2
default_floating_border pixel 2

# Only reaches tabbed/stacked tab titles, the one place sway still draws text.
font pango:JetBrainsMono Nerd Font 10

# Borders: border background text indicator child_border
client.focused          #3c4256 #3c4256 #12141a #3c4256 #3c4256
client.focused_inactive #12141a #12141a #a9aec1 #12141a #12141a
client.unfocused        #12141a #12141a #a9aec1 #12141a #12141a
client.urgent           #ff6188 #ff6188 #12141a #ff6188 #ff6188

# Floating windows
for_window [app_id="blueman-manager|pavucontrol"] floating enable, resize set 900 700, move position center

# Follow apps that ask for focus
focus_on_window_activation focus
